<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skapxd — Núcleo sereno</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a1a; color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1280px; margin: auto; padding: 40px 24px; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 4vw, 42px); letter-spacing: -1px; }
    p { margin: 0 0 28px; color: #b0b0b0; line-height: 1.6; }
    figure { margin: 0 0 36px; }
    figcaption { margin-bottom: 12px; color: #b0b0b0; font-size: 13px; }
    img { display: block; width: 100%; height: auto; }
    .mobile { max-width: 390px; }
    a { color: #fff; text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid #c0392b; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Núcleo sereno</h1>
    <p>Un doble latido en la x, un halo compacto que se apaga suavemente y una pausa. Loop de 1,6 segundos.</p>
    <figure>
      <figcaption>Cabecera del README</figcaption>
      <img id="hero" src="assets/skapxd-signal.svg" width="1200" height="480" alt="Skapxd: nombre blanco con una x roja que emite un doble pulso de luz.">
    </figure>
    <figure class="mobile">
      <figcaption>Vista compacta · 390 px</figcaption>
      <img src="assets/skapxd-signal.svg" width="1200" height="480" alt="La misma cabecera en formato compacto.">
    </figure>
    <p><a href="assets/skapxd-signal.svg" download>Descargar SVG</a></p>
  </main>
</body>
</html>
