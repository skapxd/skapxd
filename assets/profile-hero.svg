<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Manuel Meneses - Staff Software Engineer and Solutions Architect</title>
  <desc id="desc">Dark banking architecture profile banner with digital onboarding, decision engines, enterprise APIs, Azure DevOps and TypeScript tooling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07090d"/>
      <stop offset="0.58" stop-color="#111318"/>
      <stop offset="1" stop-color="#171014"/>
    </linearGradient>
    <linearGradient id="rule" x1="90" y1="0" x2="1120" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B6472"/>
      <stop offset="0.5" stop-color="#8B1A1A"/>
      <stop offset="1" stop-color="#C0392B"/>
    </linearGradient>
    <pattern id="ledgerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#D8DEE9" stroke-opacity="0.045"/>
    </pattern>
    <style>
      .eyebrow { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .16em; }
      .title { font: 800 66px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -.035em; }
      .subtitle { font: 650 28px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font: 750 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .03em; }
      .micro { font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .08em; }
      .mono { font: 650 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: .01em; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="url(#rule)" stroke-opacity="0.5" stroke-width="2"/>
  <rect width="1200" height="420" rx="28" fill="url(#ledgerGrid)"/>
  <path d="M0 318H1200" stroke="#D8DEE9" stroke-opacity="0.08"/>
  <path d="M0 102H1200" stroke="#D8DEE9" stroke-opacity="0.06"/>

  <g transform="translate(74 62)">
    <rect width="194" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.055" stroke="#D8DEE9" stroke-opacity="0.12"/>
    <rect x="14" y="22" width="5" height="8" rx="1" fill="#F3B6AF"/>
    <rect x="22" y="17" width="5" height="13" rx="1" fill="#C0392B"/>
    <rect x="30" y="12" width="5" height="18" rx="1" fill="#8B1A1A"/>
    <text x="44" y="28" fill="#E5E7EB" class="eyebrow">BANKING CORE</text>
  </g>

  <text x="74" y="182" fill="#F8FAFC" class="title">Manuel Meneses</text>
  <text x="78" y="228" fill="#CBD5E1" class="subtitle">Staff Software Engineer &amp; Solutions Architect</text>
  <text x="80" y="268" fill="#F0A39B" class="label">Onboarding digital · Decisiones de crédito · APIs bancarias</text>

  <g transform="translate(78 306)">
    <rect width="118" height="34" rx="7" fill="#1E293B" stroke="#D8DEE9" stroke-opacity="0.16"/>
    <text x="20" y="23" fill="#D8DEE9" class="label">TypeScript</text>
    <rect x="130" width="98" height="34" rx="7" fill="#1E293B" stroke="#D8DEE9" stroke-opacity="0.16"/>
    <text x="153" y="23" fill="#D8DEE9" class="label">NestJS</text>
    <rect x="240" width="105" height="34" rx="7" fill="#1E293B" stroke="#D8DEE9" stroke-opacity="0.16"/>
    <text x="262" y="23" fill="#D8DEE9" class="label">Node.js</text>
    <rect x="357" width="128" height="34" rx="7" fill="#8B1A1A" fill-opacity="0.92"/>
    <text x="388" y="23" fill="#FFFFFF" class="label">Crédito</text>
  </g>

  <g transform="translate(704 64)">
    <rect width="372" height="288" rx="18" fill="#0F141B" fill-opacity="0.88" stroke="#D8DEE9" stroke-opacity="0.13"/>
    <rect x="24" y="24" width="324" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.045" stroke="#D8DEE9" stroke-opacity="0.1"/>
    <text x="44" y="52" fill="#E5E7EB" class="label">Arquitectura bancaria</text>

    <g transform="translate(30 100)">
      <rect width="88" height="58" rx="12" fill="#111827" stroke="#D8DEE9" stroke-opacity="0.16"/>
      <text x="18" y="34" fill="#CBD5E1" class="micro">CAPTURA</text>

      <rect x="130" width="88" height="58" rx="12" fill="#111827" stroke="#8B1A1A" stroke-opacity="0.55"/>
      <text x="152" y="26" fill="#F0A39B" class="micro">REGLAS</text>
      <text x="152" y="44" fill="#CBD5E1" class="mono">score()</text>

      <rect x="260" width="88" height="58" rx="12" fill="#111827" stroke="#D8DEE9" stroke-opacity="0.16"/>
      <text x="284" y="34" fill="#CBD5E1" class="micro">API</text>

      <path d="M92 29H126" stroke="#8B1A1A" stroke-width="3" stroke-linecap="round"/>
      <path d="M222 29H256" stroke="#8B1A1A" stroke-width="3" stroke-linecap="round"/>
      <circle cx="126" cy="29" r="5" fill="#F0A39B"/>
      <circle cx="256" cy="29" r="5" fill="#F0A39B"/>
    </g>

    <g transform="translate(30 196)">
      <rect width="318" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#D8DEE9" stroke-opacity="0.1"/>
      <text x="18" y="25" fill="#F0A39B" class="micro">TRAZABILIDAD</text>
      <text x="18" y="44" fill="#CBD5E1" class="mono">solicitud → validación → decisión</text>
    </g>
  </g>

  <g opacity="0.68">
    <path d="M600 74V348" stroke="#D8DEE9" stroke-opacity="0.08"/>
    <path d="M568 92H636" stroke="#D8DEE9" stroke-opacity="0.1"/>
    <path d="M568 132H636" stroke="#D8DEE9" stroke-opacity="0.1"/>
    <path d="M568 172H636" stroke="#D8DEE9" stroke-opacity="0.1"/>
    <path d="M568 212H636" stroke="#D8DEE9" stroke-opacity="0.1"/>
    <path d="M568 252H636" stroke="#D8DEE9" stroke-opacity="0.1"/>
    <path d="M568 292H636" stroke="#D8DEE9" stroke-opacity="0.1"/>
    <rect x="590" y="94" width="20" height="20" rx="4" fill="#8B1A1A"/>
    <rect x="590" y="174" width="20" height="20" rx="4" fill="#C0392B"/>
    <rect x="590" y="254" width="20" height="20" rx="4" fill="#8B1A1A"/>
  </g>
</svg>
