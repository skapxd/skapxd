<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Manuel Meneses - Staff Software Engineer and Solutions Architect</title>
  <desc id="desc">Banking-oriented profile hero with contained layout boxes for professional positioning, credit decision architecture, traceability and TypeScript tooling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07090D"/>
      <stop offset="0.58" stop-color="#10141B"/>
      <stop offset="1" stop-color="#171014"/>
    </linearGradient>
    <linearGradient id="frameStroke" x1="24" y1="24" x2="1176" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B5563"/>
      <stop offset="0.55" stop-color="#8B1A1A"/>
      <stop offset="1" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="64" y1="64" x2="1116" y2="356" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1017" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#121820" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="auditLine" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8DEE9" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#C0392B" stop-opacity="0.68">
        <animate attributeName="stop-opacity" values="0.42;0.76;0.42" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#D8DEE9" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="ledgerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#D8DEE9" stroke-opacity="0.042"/>
    </pattern>
    <style>
      .eyebrow { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .15em; }
      .title { font: 800 64px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -.035em; }
      .subtitle { font: 650 26px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font: 750 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .025em; }
      .micro { font: 750 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .09em; }
      .mono { font: 650 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: .01em; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#ledgerGrid)"/>

  <rect x="24" y="24" width="1152" height="372" rx="28" fill="#0A0D12" fill-opacity="0.28" stroke="url(#frameStroke)" stroke-width="2" stroke-opacity="0.46">
    <animate attributeName="stroke-opacity" values="0.34;0.58;0.34" dur="8s" repeatCount="indefinite"/>
  </rect>
  <path d="M24 110H1176" stroke="#D8DEE9" stroke-opacity="0.055"/>
  <path d="M24 314H1176" stroke="#D8DEE9" stroke-opacity="0.06"/>

  <rect x="64" y="64" width="576" height="292" rx="20" fill="url(#panelFill)" stroke="#D8DEE9" stroke-opacity="0.09"/>
  <rect x="686" y="64" width="430" height="292" rx="20" fill="url(#panelFill)" stroke="#D8DEE9" stroke-opacity="0.13"/>
  <path d="M660 82V338" stroke="url(#auditLine)" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <g transform="translate(92 92)">
    <rect width="214" height="42" rx="9" fill="#FFFFFF" fill-opacity="0.052" stroke="#D8DEE9" stroke-opacity="0.13"/>
    <rect x="16" y="23" width="5" height="8" rx="1" fill="#F3B6AF"/>
    <rect x="24" y="18" width="5" height="13" rx="1" fill="#C0392B"/>
    <rect x="32" y="13" width="5" height="18" rx="1" fill="#8B1A1A"/>
    <text x="50" y="29" fill="#E5E7EB" class="eyebrow">BANKING CORE</text>
  </g>

  <text x="92" y="190" fill="#F8FAFC" class="title">Manuel Meneses</text>
  <text x="96" y="236" fill="#CBD5E1" class="subtitle">Staff Software Engineer · Solutions Architect</text>
  <text x="98" y="276" fill="#F0A39B" class="label">Onboarding digital · Decisiones de crédito · APIs bancarias</text>

  <g transform="translate(96 314)">
    <rect width="118" height="34" rx="7" fill="#1E293B" stroke="#D8DEE9" stroke-opacity="0.18"/>
    <text x="20" y="23" fill="#D8DEE9" class="label">TypeScript</text>
    <rect x="130" width="98" height="34" rx="7" fill="#1E293B" stroke="#D8DEE9" stroke-opacity="0.18"/>
    <text x="153" y="23" fill="#D8DEE9" class="label">NestJS</text>
    <rect x="240" width="105" height="34" rx="7" fill="#1E293B" stroke="#D8DEE9" stroke-opacity="0.18"/>
    <text x="262" y="23" fill="#D8DEE9" class="label">Node.js</text>
    <rect x="357" width="126" height="34" rx="7" fill="#8B1A1A" fill-opacity="0.92"/>
    <text x="388" y="23" fill="#FFFFFF" class="label">Crédito</text>
  </g>

  <g transform="translate(718 88)">
    <rect width="366" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.052" stroke="#D8DEE9" stroke-opacity="0.11"/>
    <text x="22" y="29" fill="#E5E7EB" class="label">Arquitectura bancaria</text>
  </g>

  <g transform="translate(724 164)">
    <rect width="90" height="58" rx="12" fill="#111827" stroke="#D8DEE9" stroke-opacity="0.17"/>
    <text x="20" y="35" fill="#CBD5E1" class="micro">CAPTURA</text>

    <rect x="132" width="90" height="58" rx="12" fill="#111827" stroke="#8B1A1A" stroke-opacity="0.7"/>
    <text x="156" y="26" fill="#F0A39B" class="micro">REGLAS</text>
    <text x="156" y="44" fill="#CBD5E1" class="mono">score()</text>

    <rect x="264" width="90" height="58" rx="12" fill="#111827" stroke="#D8DEE9" stroke-opacity="0.17"/>
    <text x="292" y="35" fill="#CBD5E1" class="micro">API</text>

    <path d="M92 29H128" stroke="url(#auditLine)" stroke-width="3" stroke-linecap="round"/>
    <path d="M224 29H260" stroke="url(#auditLine)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="92" cy="29" r="4.5" fill="#F0A39B"/>
    <circle cx="128" cy="29" r="4.5" fill="#F0A39B"/>
    <circle cx="224" cy="29" r="4.5" fill="#F0A39B"/>
    <circle cx="260" cy="29" r="4.5" fill="#F0A39B"/>
  </g>

  <g transform="translate(724 260)">
    <rect width="360" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#D8DEE9" stroke-opacity="0.11"/>
    <text x="20" y="25" fill="#F0A39B" class="micro">TRAZABILIDAD</text>
    <text x="20" y="44" fill="#CBD5E1" class="mono">solicitud → validación → decisión</text>
    <path d="M302 20H336" stroke="url(#auditLine)" stroke-width="4" stroke-linecap="round" opacity="0.78"/>
    <path d="M302 36H326" stroke="#D8DEE9" stroke-opacity="0.38" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
